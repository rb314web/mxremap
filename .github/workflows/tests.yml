name: Testy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Zależności
        run: dnf install -y python3 python3-evdev python3-gobject python3-cairo gtk4 libadwaita libnotify
      - name: Testy
        run: python3 -m unittest discover -s tests -v
