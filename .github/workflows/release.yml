name: Wydanie
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia
        run: dnf install -y rpm-build python3 python3-evdev python3-gobject python3-cairo gtk4 libadwaita
      - name: Testy
        run: python3 -m unittest discover -s tests
      - name: Wersja z tagu
        run: sed -i "s/^Version:.*/Version:        ${GITHUB_REF_NAME#v}/" packaging/mxremap.spec
      - name: Budowa RPM
        run: RPMTOP=$PWD/rpmbuild bash packaging/build-rpm.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: rpmbuild/RPMS/noarch/*.rpm
          generate_release_notes: true
